[package]
name = "smarttaskbar-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.62", features = [
    "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Control",
    "Storage_Streams", "Win32_System_WinRT"
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader",
    "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
strip = "debuginfo"
codegen-units = 1
